  <title>Pairlock</title>
  <style>
/* No external fonts: a privacy tool must not phone home on open. */
:root {
  --bg: #081018;
  --bg-2: #0c1622;
  --panel: #121c2a;
  --panel-2: #162234;
  --input: #1a2738;
  --line: rgba(148, 186, 214, 0.12);
  --accent: #3db4f2;
  --accent-2: #1f93d4;
  --accent-soft: rgba(61, 180, 242, 0.14);
  --bubble-out: #245a86;
  --bubble-in: #152433;
  --text: #f4f8fc;
  --muted: #7f96aa;
  --meta: #9eb6c9;
  --danger: #ff5c5c;
  --ok: #3dd68c;
  --warn: #f0b429;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --radius: 18px;
  --radius-sm: 12px;
  --font: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(61, 180, 242, 0.18), transparent 55%),
    radial-gradient(700px 420px at 100% 0%, rgba(45, 120, 180, 0.12), transparent 50%),
    linear-gradient(180deg, #0a121c 0%, var(--bg) 42%, #070d14 100%);
  color: var(--text);
  min-height: 100dvh;
  letter-spacing: -0.01em;
}

/* Chrome sizes the action popup by the document — lock to chat width (400). */
html:has(body.popup),
body.popup {
  width: 400px;
  min-width: 400px;
  max-width: 400px;
  overflow-x: hidden;
  min-height: 560px;
  height: 560px;
  background: var(--bg-2);
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

.wrap {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    linear-gradient(180deg, rgba(18, 28, 42, 0.72), rgba(8, 16, 24, 0.92)),
    var(--bg-2);
  box-shadow: var(--shadow);
  padding-bottom: calc(72px + var(--safe-b));
  animation: rise 420ms ease-out;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

body.popup .wrap {
  max-width: 400px;
  width: 400px;
  min-width: 400px;
  min-height: 560px;
  height: 560px;
  margin: 0;
  padding-bottom: 76px;
  box-shadow: none;
  animation: none;
  overflow-x: hidden;
}

.top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + var(--safe-t)) 14px 12px;
  background: rgba(12, 22, 34, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

.brand h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -0.03em;
}
.brand p {
  margin: 2px 0 0;
  color: var(--meta);
  font-size: 12px;
  font-weight: 500;
}

.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang, .pill {
  border: 1px solid var(--line);
  background: rgba(26, 39, 56, 0.9);
  color: var(--meta);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 650;
  min-height: 34px;
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}
.lang:hover { color: var(--text); border-color: rgba(61, 180, 242, 0.35); }
.pill { color: var(--meta); }

.card {
  margin: 14px;
  background: transparent;
  border: 0;
  padding: 0;
}

h2 {
  margin: 8px 4px 6px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.04em;
}
.lead {
  margin: 0 4px 12px;
  color: var(--muted);
  line-height: 1.45;
  font-size: 13px;
  font-weight: 500;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 650;
  color: var(--meta);
  margin: 14px 0 7px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

input[type="password"],
input[type="text"],
textarea,
select {
  width: 100%;
  background: var(--input);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
input:focus, textarea:focus, select:focus {
  border-color: rgba(61, 180, 242, 0.55);
  box-shadow: 0 0 0 4px var(--accent-soft);
  background: #1d2c40;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 9px 14px;
  background: linear-gradient(180deg, #54c2f7, var(--accent));
  color: #041018;
  font-weight: 750;
  font-size: 13px;
  min-height: 40px;
  transition: transform 140ms ease, filter 140ms ease, background 140ms ease;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.98); }
.btn.secondary {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
}
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost {
  background: transparent;
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(61, 180, 242, 0.35);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
a.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  box-sizing: border-box;
}

.err, .ok, .warn {
  margin: 12px 4px;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 600;
}
.err { color: #ff8f8f; }
.ok { color: #7be3b0; }
.warn { color: var(--warn); }

.tabs {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(400px, 100%);
  display: flex;
  gap: 4px;
  background: rgba(12, 22, 34, 0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(10px + var(--safe-b));
  z-index: 6;
}
body.popup .tabs { width: 100%; left: 0; transform: none; }
.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 4px 6px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 10px;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 140ms ease, background 140ms ease;
}
.tab svg { width: 22px; height: 22px; fill: currentColor; }
.tab.active {
  color: var(--accent);
  background: var(--accent-soft);
}

.chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0 8px;
}
.bubble {
  max-width: 92%;
  padding: 12px 14px 10px;
  border-radius: 18px;
  line-height: 1.45;
  font-size: 15px;
  animation: bubble-in 220ms ease-out;
}
@keyframes bubble-in {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
.bubble.in {
  align-self: flex-start;
  background: var(--bubble-in);
  border: 1px solid var(--line);
  border-bottom-left-radius: 6px;
}
.bubble.out {
  align-self: flex-end;
  background: linear-gradient(160deg, #2d6fa3, var(--bubble-out));
  border-bottom-right-radius: 6px;
}
.bubble .cap {
  font-size: 12px;
  color: var(--meta);
  margin-bottom: 6px;
  font-weight: 650;
}
.bubble textarea {
  background: transparent;
  padding: 0;
  min-height: 72px;
  border-radius: 0;
  border: 0;
  box-shadow: none;
}
.bubble.out textarea { color: #eef7fd; }
.composer {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  margin-top: 10px;
}
.composer select { flex: 1; }
.send {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(180deg, #54c2f7, var(--accent));
  color: #041018;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  padding: 0;
  transition: transform 140ms ease;
}
.send:active { transform: scale(0.94); }
.send svg { width: 20px; height: 20px; fill: #041018; }

.key-card {
  background: linear-gradient(180deg, rgba(26, 39, 56, 0.95), rgba(18, 28, 42, 0.98));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 12px 12px;
  text-align: center;
  box-shadow: var(--shadow);
}
.qr {
  width: min(156px, 52vw);
  margin: 6px auto 10px;
  padding: 8px;
  background: #fff;
  border-radius: 12px;
}
.qr svg { width: 100%; height: auto; display: block; }
.keybox {
  font-family: var(--mono);
  font-size: 10px;
  word-break: break-all;
  text-align: left;
  background: var(--input);
  border-radius: var(--radius-sm);
  padding: 10px;
  color: #c8d8e6;
  border: 1px solid var(--line);
}
.fp {
  font-family: var(--mono);
  letter-spacing: 0.08em;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}

.callout {
  margin-top: 14px;
  padding: 14px 15px;
  border-radius: 14px;
  background: var(--accent-soft);
  border: 1px solid rgba(61, 180, 242, 0.2);
  color: #d7ecf8;
  font-size: 13px;
  line-height: 1.55;
  text-align: left;
  font-weight: 500;
}
.callout.warn {
  background: rgba(240, 180, 41, 0.12);
  border-color: rgba(240, 180, 41, 0.22);
  color: #f6e2a8;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 14px 15px;
  background: transparent;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.item:last-child { border-bottom: 0; }
.item b { display: block; font-size: 15px; font-weight: 700; }
.item small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.item-person { flex-direction: column; align-items: stretch; gap: 8px; }
.person-head b { font-size: 16px; }
.person-meta {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 550;
  line-height: 1.4;
  font-family: inherit;
}
.person-actions { margin: 0; }
.item-confirm {
  background: rgba(229, 72, 77, 0.1);
  border: 1px solid rgba(229, 72, 77, 0.35);
  border-radius: 12px;
  padding: 12px;
}
.item-confirm b { font-size: 14px; margin-bottom: 4px; }
.item-confirm p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
  font-weight: 500;
}
.people-empty { padding: 8px 4px 4px; }
.people-empty .lead { margin-bottom: 6px; }
.people-foot { margin-top: 12px; }
.people-manual { margin-top: 12px; }

.note {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
  margin: 12px 0 0;
  font-weight: 500;
}

.faq { display: flex; flex-direction: column; gap: 10px; }
.faq-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px;
  transition: border-color 160ms ease, transform 160ms ease;
}
.faq-item:hover { border-color: rgba(61, 180, 242, 0.28); }
.faq-item h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -0.02em;
}
.faq-item p {
  margin: 0;

/* Message pad */

  display: flex;

/* Extension: current dialog status */
.status-card {
  border-radius: 16px;

}

.st-title {

.wizard-nav { margin-top: 18px; }

}
.wait-box {

}
.how-item p {

}

.fp-card {

}

.badge {

}

.status-dot {

  padding: 12px 14px;
  color: var(--text);
  transition: border-color 140ms ease, background 140ms ease;
}
.mode-card:hover { border-color: rgba(61, 180, 242, 0.35); }
.mode-card.on {
  border-color: rgba(61, 180, 242, 0.55);
  background: var(--accent-soft);
}
.mode-card:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.ttl-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.ttl-chip {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 650;
  min-height: 32px;
}
.ttl-chip.on {
  border-color: rgba(61, 180, 242, 0.55);
  background: var(--accent-soft);
  color: var(--accent);
}
.ttl-chip:disabled { opacity: 0.4; cursor: not-allowed; }
.keys-ttl { margin-top: 4px; }
.mode-title { font-size: 14px; font-weight: 750; }
.mode-hint { font-size: 12px; color: var(--muted); line-height: 1.35; font-weight: 500; }
.keys-burn {
  font-size: 12px;
  color: var(--warn);
  padding: 0 2px;
}
.keys-safe-warn {
  margin-top: 4px;
  font-size: 12px;
  padding: 10px 12px;
}
.keys-bar { margin-top: 0; }
.keys-more .check { margin-top: 10px; font-size: 13px; }
.keys-more textarea { min-height: 64px; }
body.popup .keys-id .qr { width: 80px; }

    return new DataView(bytes.buffer, bytes.byteOffset, 4).getUint32(0, false);
  }

  /* V2 layout: MAGIC(10) | iterations(4) | salt(16) | nonce(12) | AES-GCM(ct+tag) */
  async function wrapBlob(keyBytes, salt, iter, plaintext) {
    const nonce = C().randomBytes(12);
    const ct = await C().aesGcmEncrypt(keyBytes, nonce, C().utf8(plaintext), C().utf8(MAGIC));
    const packed = C().concatBytes([C().utf8(MAGIC), u32(iter), salt, nonce, ct]);
    return C().bytesToB64url(packed);
  }

  /* Returns { json, key, salt, iter, legacy }. Understands V1 (fixed 250k) and V2. */
  async function unwrapBlob(password, blob) {
    const packed = C().b64urlToBytes(String(blob).trim());
    const m2 = C().utf8(MAGIC);
    const m1 = C().utf8(MAGIC_V1);
    if (packed.length < m2.length + 16 + 12 + 16) throw new Error("Хранилище повреждено");
    let o = m2.length;
    let iter;
    let legacy;
    let ad;
    if (C().timingSafeEqual(packed.subarray(0, m2.length), m2)) {
      if (packed.length < o + 4 + 16 + 12 + 16) throw new Error("Хранилище повреждено");
      iter = readU32(packed.subarray(o, o + 4));
      o += 4;
      if (iter < MIN_ITERATIONS || iter > MAX_ITERATIONS) throw new Error("Хранилище повреждено");
      legacy = false;
      ad = m2;
    } else if (C().timingSafeEqual(packed.subarray(0, m1.length), m1)) {
      iter = LEGACY_ITERATIONS;
      legacy = true;
      ad = m1;
    } else {
      throw new Error("Это не хранилище S256");
    }
    const salt = packed.slice(o, o + 16); o += 16;
    const nonce = packed.subarray(o, o + 12); o += 12;
    const ct = packed.subarray(o);
    const key = await C().pbkdf2(password, salt, iter);
    try {
      const pt = await C().aesGcmDecrypt(key, nonce, ct, ad);
      return { json: C().utf8dec(pt), key, salt, iter, legacy };
    } catch {
      throw new Error("Неверный пароль");
    }
  }

  async function deriveFresh(password) {
    const salt = C().randomBytes(16);
    const key = await C().pbkdf2(password, salt, ITERATIONS);
    return { key, salt, iter: ITERATIONS };
  }

  function adoptKey(k) {
    memory.key = k.key;
    memory.salt = k.salt;
    memory.iter = k.iter;
  }

  async function persistSession() {
    if (!memory.state) return;
    await setSession(SESSION_KEY, serializeState(memory.state));
    if (memory.key) {
      await setSession(
        KEY_KEY,
        JSON.stringify({ k: C().bytesToB64url(memory.key), s: C().bytesToB64url(memory.salt), i: memory.iter })
      );
    }
  }

  async function persist() {
    if (!memory.state) return;
    await persistSession();
    if (!memory.key) return;
    const blob = await wrapBlob(memory.key, memory.salt, memory.iter, serializeState(memory.state));
    await setLocal(STORAGE_KEY, blob);
  }

  async function hasVault() {
    if (await enforceBurn()) return false;
    const blob = await getLocal(STORAGE_KEY);
    return !!blob;
  }

  function checkPassword(password) {
    if (!password || password.length < 8) throw new Error("Пароль минимум 8 символов");
  }

  async function create(password) {
    checkPassword(password);
    if (await getLocal(STORAGE_KEY)) throw new Error("Хранилище уже есть — откройте паролем");
    await removeLocal(BURN_AT_KEY);
    const identity = await C().generateIdentity();
    adoptKey(await deriveFresh(password));
    memory.state = {
      version: 1,
      identity,
      contacts: [],
      sentCache: {},
      threads: {},
      fragBuf: {},
      settings: defaultSettings(),
    };
    memory.identity = identity;
    await persist();
    return memory.state;
  }

  async function unlock(password) {
    if (await enforceBurn()) throw new Error("Хранилище сожжено по таймеру — ключей больше нет");
    const blob = await getLocal(STORAGE_KEY);
    if (!blob) throw new Error("Хранилище ещё не создано");
    const res = await unwrapBlob(password, blob);
    memory.state = await hydrateState(JSON.parse(res.json));
    memory.identity = memory.state.identity;
    if (res.legacy || res.iter < ITERATIONS) {
      /* transparently upgrade V1 / weak-iteration blobs */
      adoptKey(await deriveFresh(password));
      await persist();
    } else {
      adoptKey(res);
      await persistSession();
    }
    if (await enforceBurn()) throw new Error("Хранилище сожжено по таймеру — ключей больше нет");
    /* keep plaintext deadline in sync if it was only inside the vault settings */
    const bAt = (memory.state.settings && memory.state.settings.burnAt) || 0;
    if (bAt > Date.now()) await setLocal(BURN_AT_KEY, String(bAt));
    else if (bAt && bAt <= Date.now()) {
      await burnVaultNow();
      throw new Error("Хранилище сожжено по таймеру — ключей больше нет");
    }
    return memory.state;
  }

  async function restoreSession() {
    if (await enforceBurn()) return null;
    const json = await getSession(SESSION_KEY);
    if (!json) {
      memory.state = null;
      memory.identity = null;
      memory.key = null;
      memory.salt = null;
      return null;
    }
    memory.state = await hydrateState(JSON.parse(json));
    memory.identity = memory.state.identity;
    try {
      const k = JSON.parse((await getSession(KEY_KEY)) || "null");
      if (k && k.k && k.s) {
        memory.key = C().b64urlToBytes(k.k);
        memory.salt = C().b64urlToBytes(k.s);
        memory.iter = k.i || ITERATIONS;
      }
    } catch {
      /* state stays readable; writes will need a re-unlock */
    }
    if (await enforceBurn()) return null;
    return memory.state;
  }

  async function lock() {
    if (memory.key) memory.key.fill(0);
    memory.key = null;
    memory.salt = null;
    memory.state = null;
    memory.identity = null;
    await removeSession(SESSION_KEY);
    await removeSession(KEY_KEY);
  }

  function requireState() {
    if (!memory.state) throw new Error("Хранилище заблокировано");
    return memory.state;
  }

  /* Offer TTL for the next pair / QR. Does not wipe the vault or lock other contacts. */
  async function ensureSafePair(ttlSec) {
    const state = requireState();
    state.settings = Object.assign(blankSettings(), state.settings || {});
    const n = ttlSec != null ? Number(ttlSec) >>> 0 : state.settings.keyTtlSec || 86400;
    if (!P().isAllowedTtl(n)) throw new Error("Недопустимый срок");
    state.settings.keyTtlSec = n;
    state.settings.pendingSession = null;
    state.settings.safeLocked = false;
    await persist();
    return {
      keyTtlSec: state.settings.keyTtlSec,
      burnVaultSec: state.settings.burnVaultSec || 0,
      burnAt: state.settings.burnAt || 0,
      locked: false,
    };
  }

  /* Optional whole-vault wipe (advanced). Not tied to per-contact secret chats. */
  function isBurnMode() {
    const state = memory.state;
    if (!state || !state.settings) return false;
    const s = state.settings;
    if ((s.burnAt || 0) > Date.now()) return true;
    return false;
  }

  function isSafeLocked() {
    return isBurnMode();
  }

  async function commitSafePair(ttlSec) {
    /* Per-contact only — kept for API compat; does not schedule vault burn. */
    const n = Number(ttlSec) >>> 0;
    if (!P().isAllowedTtl(n)) throw new Error("Недопустимый срок");
    return requireState().settings;
  }

  async function setPairMode(mode, ttlSec) {
    const state = requireState();
    state.settings = Object.assign(blankSettings(), state.settings || {});
    if (mode === "safe") {
      const n = ttlSec != null ? Number(ttlSec) >>> 0 : state.settings.keyTtlSec || 86400;
      const r = await ensureSafePair(n);
      return { ...r, needsRekey: false, foreverPairs: 0 };
    }
    state.settings.keyTtlSec = 0;
    state.settings.pendingSession = null;
    state.settings.safeLocked = false;
    await persist();
    return {
      keyTtlSec: 0,
      burnVaultSec: state.settings.burnVaultSec || 0,
      burnAt: state.settings.burnAt || 0,
      locked: isSafeLocked(),
      needsRekey: false,
    };
  }

  function pairModeView() {
    const state = memory.state;
    const s = state && state.settings ? state.settings : {};
    const ttlOn = !!(s.keyTtlSec > 0);
    let timedContacts = 0;
    if (state && state.contacts) {
      for (const c of state.contacts) {
        if (c.ttlSec && !c.sessionWiped && c.sessionIkm) timedContacts += 1;
      }
    }
    return {
      mode: ttlOn ? "safe" : "forever",
      keyTtlSec: s.keyTtlSec || 0,
      burnVaultSec: s.burnVaultSec || 0,
      burnAt: s.burnAt || 0,
      locked: isSafeLocked(),
      safeLocked: false,
      burnMode: isBurnMode(),
      needsRekey: false,
      timedContacts,
      foreverPairs: 0,
    };
  }

  async function addContact(name, publicKeyText) {
    const state = requireState();
    state.settings = Object.assign(blankSettings(), state.settings || {});
    const parsed = P().parsePeerKey(publicKeyText);
    const theirPub = parsed.publicRaw;
    if (C().timingSafeEqual(theirPub, state.identity.publicRaw)) {
      throw new Error("Нельзя добавить свой ключ");
    }
    const fingerprint = await C().fingerprintDisplay(theirPub);
    const existing = state.contacts.find((c) => c.fingerprint === fingerprint);
    if (existing) {
      if (parsed.timed) {
        await attachSession(existing, parsed);
      } else {
        wipeContactSession(existing, { keepThread: true });
        existing.ttlSec = 0;
        existing.expiresAt = 0;
        existing.pairedAt = Date.now();
        existing.sessionWiped = false;
        if ((state.settings.keyTtlSec || 0) > 0) {
          state.settings.keyTtlSec = 0;
          state.settings.pendingSession = null;
        }
      }
      const nm = (name || "").trim().slice(0, 64);
      if (nm) existing.name = nm;
      await persist();
      return existing;
    }
    const contact = {
      id: fingerprint,
      name: (name || "Контакт").trim().slice(0, 64),
      theirPub,
      fingerprint,
      bindings: {},
      verified: false,
      createdAt: Date.now(),
      ttlSec: 0,
    };
    if (parsed.timed) {
      await attachSession(contact, parsed);
      state.contacts.push(contact);
      await persist();
      return contact;
    }
    /* Forever key while we had a timed offer → accept forever for this pair. */
    if ((state.settings.keyTtlSec || 0) > 0) {
      state.settings.keyTtlSec = 0;
      state.settings.pendingSession = null;
    }
    state.contacts.push(contact);
    await persist();
    return contact;
  }

  function wipeContactSession(c, opts) {
    if (c.sessionIkm && c.sessionIkm.fill) c.sessionIkm.fill(0);
    c.sessionIkm = null;
    c.sessionIkmB64 = null;
    c.sessionPrivB64 = null;
    c.sessionPubB64 = null;
    c.theirSessionPubB64 = null;
    c.sessionWiped = true;
    if (memory.state && memory.state.sentCache) {
      for (const k of Object.keys(memory.state.sentCache)) {
        if (memory.state.sentCache[k] && memory.state.sentCache[k].contactId === c.id) {
          delete memory.state.sentCache[k];
        }
      }
    }
    if (!(opts && opts.keepThread) && memory.state && memory.state.threads) delete memory.state.threads[c.id];
  }

  async function ensurePendingSession(ttlSec) {
    if (!P().isAllowedTtl(ttlSec)) throw new Error("Недопустимый срок ключей");
    const state = requireState();
    state.settings = Object.assign(defaultSettings(), state.settings || {});
    const cur = state.settings.pendingSession;
    const nowSec = Math.floor(Date.now() / 1000);
    const bound =
      cur &&
      state.contacts &&
      state.contacts.some((c) => c.sessionPubB64 && cur.pubB64 && c.sessionPubB64 === cur.pubB64);
    if (cur && cur.ttlSec === ttlSec && cur.privB64 && cur.pubB64 && nowSec - (cur.issuedAt || 0) < ttlSec && !bound) {
      return cur;
    }
    const kp = await C().generateX25519();
    const pending = {
      pubB64: C().bytesToB64url(kp.publicRaw),
      privB64: C().bytesToB64url(kp.privateRaw),
      ttlSec,
      issuedAt: nowSec,
    };
    state.settings.pendingSession = pending;
    await persist();
    return pending;
  }

  async function attachSession(c, parsed) {
    const state = requireState();
    if (!parsed.timed) {
      throw new Error("Нужен срочный ключ S256KT1 — бессрочный сюда не подходит.");
    }
    const want = (state.settings.keyTtlSec || 0) >>> 0;
    /* Pairing with their key = accept their lifetime for this contact (no trip to Keys). */
    if (want !== parsed.ttlSec) {
      state.settings.keyTtlSec = parsed.ttlSec;
      state.settings.pendingSession = null;
    }
    const pending = await ensurePendingSession(parsed.ttlSec);
    const sessionIkm = await C().x25519Dh(C().b64urlToBytes(pending.privB64), parsed.sessionPub);
    wipeContactSession(c);
    c.ttlSec = parsed.ttlSec;
    c.pairedAt = Date.now();
    c.expiresAt = c.pairedAt + parsed.ttlSec * 1000;
    c.sessionWiped = false;
    c.sessionPrivB64 = pending.privB64;
    c.sessionPubB64 = pending.pubB64;
    c.theirSessionPubB64 = C().bytesToB64url(parsed.sessionPub);
    c.sessionIkm = sessionIkm;
    /* Keep pending so the reply QR still advertises the same session ephemeral. */
  }

  function sessionView(c) {
    if (!c || !c.ttlSec) return { ttlSec: 0, expiresAt: 0, expired: false };
    const expired = !!(c.sessionWiped || !c.sessionIkm || Date.now() > (c.expiresAt || 0) + SESSION_GRACE_MS);
    return { ttlSec: c.ttlSec, expiresAt: c.expiresAt || 0, expired, label: ttlPhrase(c.ttlSec) };
  }

  async function expireSessions() {
    if (await enforceBurn()) return;
    if (!memory.state) return;
    const now = Date.now();
    let changed = false;
    for (const c of memory.state.contacts) {
      if (!c.ttlSec || c.sessionWiped) continue;
      if (now > (c.expiresAt || 0) + SESSION_GRACE_MS) {
        wipeContactSession(c);
        changed = true;
      }
    }
    if (changed) await persist();
  }

  /* Zero in-memory secrets and delete the vault blob. Deadline lives outside the
     ciphertext so this can run while locked (browser alarm / next open). */
  async function burnVaultNow() {
    if (memory.state && memory.state.identity && memory.state.identity.privateRaw && memory.state.identity.privateRaw.fill) {
      memory.state.identity.privateRaw.fill(0);
    }
    if (memory.state && memory.state.contacts) {
      for (const c of memory.state.contacts) wipeContactSession(c);
    }
    if (memory.key) memory.key.fill(0);
    memory.key = null;
    memory.salt = null;
    memory.state = null;
    memory.identity = null;
    await removeSession(SESSION_KEY);
    await removeSession(KEY_KEY);
    await removeLocal(STORAGE_KEY);
    await removeLocal(BURN_AT_KEY);
    return true;
  }

  async function getBurnAt() {
    const raw = await getLocal(BURN_AT_KEY);
    const n = Number(raw || 0);
    return n > 0 ? n : 0;
  }

  async function enforceBurn() {
    const at = await getBurnAt();
    if (!at || Date.now() < at) return false;
    await burnVaultNow();
    return true;
  }

  function burnView() {
    const state = memory.state;
    const sec = state && state.settings ? Number(state.settings.burnVaultSec || 0) || 0 : 0;
    const at = state && state.settings ? Number(state.settings.burnAt || 0) || 0 : 0;
    return {
      burnVaultSec: sec,
      burnAt: at,
      active: sec > 0 && at > 0,
      remainingMs: at > Date.now() ? at - Date.now() : 0,
    };
  }

  async function setVerified(id, verified) {
    const state = requireState();
    const c = state.contacts.find((x) => x.id === id);
    if (!c) throw new Error("Контакт не найден");
    c.verified = !!verified;
    await persist();
    return c;
  }

  async function setSetting(key, value) {
    const state = requireState();
    state.settings = Object.assign(blankSettings(), state.settings || {});
    if (key === "keyTtlSec") {
      const n = Number(value) >>> 0;
      if (n !== 0 && !P().isAllowedTtl(n)) throw new Error("Недопустимый срок ключей");
      state.settings.keyTtlSec = n;
      state.settings.pendingSession = null;
      state.settings.safeLocked = false;
    } else if (key === "pageDecrypt") {
      state.settings.pageDecrypt = !!value;
    } else if (key === "stealthWire") {
      state.settings.stealthWire = !!value;
    } else if (key === "burnVaultSec") {
      /* Optional whole-vault burn — independent of per-contact TTL. */
      const n = Number(value) >>> 0;
      if (n !== 0 && !P().isAllowedTtl(n)) throw new Error("Недопустимый срок сжигания");
      state.settings.burnVaultSec = n;
      if (!n) {
        state.settings.burnAt = 0;
        await removeLocal(BURN_AT_KEY);
      } else {
        const end = Date.now() + n * 1000;
        const prev = Number(state.settings.burnAt || 0) || 0;
        state.settings.burnAt = prev > Date.now() ? Math.min(prev, end) : end;
        await setLocal(BURN_AT_KEY, String(state.settings.burnAt));
      }
    } else {
      state.settings[key] = value;
    }
    await persist();
    return state.settings;
  }

  async function removeContact(id) {
    const state = requireState();
    state.contacts = state.contacts.filter((c) => c.id !== id);
    for (const k of Object.keys(state.sentCache)) {
      if (state.sentCache[k] && state.sentCache[k].contactId === id) delete state.sentCache[k];
    }
    if (state.threads) delete state.threads[id];
    await persist();
  }

  async function renameContact(id, name) {
    const state = requireState();
    const c = state.contacts.find((x) => x.id === id);
    if (!c) throw new Error("Контакт не найден");
    const nm = String(name || "").trim().slice(0, 64);
    if (!nm) throw new Error("Пустое имя");
    c.name = nm;
    await persist();
    return c;
  }

  async function bindPeer(contactId, platform, peer) {
    const state = requireState();
    const c = state.contacts.find((x) => x.id === contactId);
    if (!c) throw new Error("Контакт не найден");
    const p = String(peer).trim();
    if (!p) throw new Error("Пустой id чата");
    for (const other of state.contacts) {
      if (other.id !== contactId && other.bindings[platform] === p) {
        delete other.bindings[platform];
      }
    }
    c.bindings[platform] = p;
    await persist();
    return c;
  }

  async function unbindPeer(contactId, platform) {
    const state = requireState();
    const c = state.contacts.find((x) => x.id === contactId);
    if (!c) throw new Error("Контакт не найден");
    delete c.bindings[platform];
    await persist();
  }

  function findByBinding(platform, peer) {
    const state = requireState();
    const p = String(peer);
    return state.contacts.find((c) => c.bindings[platform] === p) || null;
  }

  function findByFingerprint(fp) {
    const state = requireState();
    return state.contacts.find((c) => c.fingerprint === fp) || null;
  }

  async function encryptForContact(contactId, plaintext) {
    const state = requireState();
    await expireSessions();
    const c = state.contacts.find((x) => x.id === contactId);
    if (!c) throw new Error("Контакт не найден");
    if (c.ttlSec && (c.sessionWiped || !c.sessionIkm || Date.now() > (c.expiresAt || 0) + SESSION_GRACE_MS)) {
      if (!c.sessionWiped) {
        wipeContactSession(c);
        await persist();
      }
      const err = new Error("Срок ключей вышел. Обменяйтесь новыми ключами S256KT1.");
      err.code = "expired";
      throw err;
    }
    const rawText = String(plaintext || "");
    if (!rawText.trim()) throw new Error("Пустой текст");
    if (utf8Bytes(rawText).length > PLAIN_CHUNK_BYTES * FRAG_MAX_PARTS) {
      throw new Error("Слишком длинное сообщение (лимит ~" + Math.floor((PLAIN_CHUNK_BYTES * FRAG_MAX_PARTS) / 1000) + " тыс. символов)");
    }
    const stealth = state.settings.stealthWire !== false;
    const chunks = splitUtf8Chunks(rawText, PLAIN_CHUNK_BYTES);
    if (chunks.length > FRAG_MAX_PARTS) throw new Error("Слишком длинное сообщение");
    const packets = [];
    const fragId = chunks.length > 1 ? makeFragId() : null;
    for (let i = 0; i < chunks.length; i++) {
      const body = fragId ? "PLF1 " + fragId + " " + i + " " + chunks.length + "\n" + chunks[i] : chunks[i];
      const packet = await P().encrypt(body, state.identity, c.theirPub, c.sessionIkm || null, { stealth });
      if (packet.length > WIRE_MAX) {
        throw new Error("Кусок не влез в лимит VK (" + WIRE_MAX + "). Укоротите сообщение.");
      }
      packets.push(packet);
      state.sentCache[packet] = { text: body, contactId: c.id, fullText: rawText, fragId: fragId || "" };
    }
    const keys = Object.keys(state.sentCache);
    if (keys.length > 400) {
      for (const k of keys.slice(0, keys.length - 400)) delete state.sentCache[k];
    }
    appendThread(state, c.id, {
      packet: fragId ? "PLF:" + fragId : packets[0],
      text: rawText,
      outgoing: true,
      ts: Date.now(),
      known: true,
      verified: !!c.verified,
    });
    await persist();
    return packets;
  }

  async function encryptForPeer(platform, peer, plaintext) {
    const c = findByBinding(platform, peer);
    if (!c) throw new Error("Чат не привязан к контакту");
    return encryptForContact(c.id, plaintext);
  }

  async function decryptPacket(packet) {
    const state = requireState();
    await expireSessions();
    const trimmed = String(packet).trim().replace(/\s+/g, "");
    const cached = state.sentCache[trimmed] || state.sentCache[packet];
    if (cached) {
      const c = state.contacts.find((x) => x.id === cached.contactId) || null;
      return {
        text: cached.text,
        contact: c,
        outgoing: true,
        fullText: cached.fullText || cached.text,
        fragId: cached.fragId || "",
      };
    }
    try {
      const parsed = P().unpack(trimmed);
      if (C().timingSafeEqual(parsed.senderPub, state.identity.publicRaw)) {
        return {
          text: "[исходящее: открытый текст есть только на устройстве, с которого отправили]",
          contact: null,
          outgoing: true,
        };
      }
    } catch {
      /* fall through to inbound decrypt */
    }
    return P().decryptAny(trimmed, state.identity, state.contacts);
  }

  function packetInThreads(state, packet) {
    const threads = state.threads || {};
    for (const id of Object.keys(threads)) {
      const list = threads[id] || [];
      if (list.some((m) => m.packet === packet)) return true;
    }
    return false;
  }

  async function ingestPackets(packets) {
    const state = requireState();
    await expireSessions();
    if (!state.fragBuf) state.fragBuf = {};
    const list = Array.isArray(packets) ? packets : [packets];
    let added = 0;
    const contactIds = [];
    const seenId = Object.create(null);
    for (let i = 0; i < list.length; i++) {
      const packet = normalizePacket(list[i]);
      if (!packet || !P().isCiphertext(packet)) continue;
      if (packetInThreads(state, packet)) continue;
      let res;
      try {
        res = await decryptPacket(packet);
      } catch {
        continue;
      }
      const contactId = res.contact && res.contact.id;
      if (!contactId) continue;
      const frag = parseFrag(res.text);
      if (!frag) {
        if (
          appendThread(state, contactId, {
            packet,
            text: res.text,
            outgoing: !!res.outgoing,
            ts: Date.now() + i,
            known: res.outgoing ? true : !!res.known,
            verified: res.outgoing ? true : !!res.verified,
          })
        ) {
          added += 1;
          if (!res.outgoing && !seenId[contactId]) {
            seenId[contactId] = true;
            contactIds.push(contactId);
          }
        }
        continue;
      }
      const assembledPacket = "PLF:" + frag.id;
      const bufKey = contactId + ":" + frag.id;
      const buf = state.fragBuf[bufKey] || {
        total: frag.total,
        parts: {},
        ts: Date.now(),
        outgoing: !!res.outgoing,
        known: res.outgoing ? true : !!res.known,
        verified: res.outgoing ? true : !!res.verified,
      };
      buf.total = frag.total;
      buf.parts[String(frag.index)] = frag.payload;
      state.fragBuf[bufKey] = buf;
      let complete = true;
      const pieces = [];
      for (let p = 0; p < frag.total; p++) {
        if (typeof buf.parts[String(p)] !== "string") {
          complete = false;
          break;
        }
        pieces.push(buf.parts[String(p)]);
      }
      if (!complete) continue;
      delete state.fragBuf[bufKey];
      if (packetInThreads(state, assembledPacket)) continue;
      const full = pieces.join("");
      if (
        appendThread(state, contactId, {
          packet: assembledPacket,
          text: full,
          outgoing: !!buf.outgoing,
          ts: Date.now() + i,
          known: buf.known !== false,
          verified: !!buf.verified,
        })
      ) {
        added += 1;
        if (!buf.outgoing && !seenId[contactId]) {
          seenId[contactId] = true;
          contactIds.push(contactId);
        }
      }
    }
    if (added || Object.keys(state.fragBuf).length) await persist();
    return { added, contactIds };
  }

  function listChats() {
    const state = requireState();
    const rows = state.contacts.map((c) => {
      const msgs = (state.threads && state.threads[c.id]) || [];
      const last = msgs.length ? msgs[msgs.length - 1] : null;
      const sess = sessionView(c);
      return {
        id: c.id,
        name: c.name,
        fingerprint: c.fingerprint,
        verified: !!c.verified,
        bindings: c.bindings || {},
        lastText: last ? last.text : "",
        lastOutgoing: last ? !!last.outgoing : false,
        lastTs: last ? last.ts : c.createdAt || 0,
        count: msgs.length,
        expired: !!sess.expired,
        ttlSec: sess.ttlSec || 0,
      };
    });
    rows.sort((a, b) => (b.lastTs || 0) - (a.lastTs || 0));
    return rows;
  }

  function getThread(contactId) {
    const state = requireState();
    const c = state.contacts.find((x) => x.id === contactId);
    if (!c) throw new Error("Контакт не найден");
    return {
      contact: {
        id: c.id,
        name: c.name,
        fingerprint: c.fingerprint,
        verified: !!c.verified,
        bindings: c.bindings || {},
      },
      session: sessionView(c),
      messages: ((state.threads && state.threads[c.id]) || []).slice(),
    };
  }

  async function exportBackup() {
    if (isBurnMode()) {
      throw new Error("Пока идёт сжигание всего хранилища, экспорт недоступен");
    }
    const blob = await getLocal(STORAGE_KEY);
    if (!blob) throw new Error("Нечего экспортировать");
    return blob;
  }

  async function importBackup(blob, password) {
    const res = await unwrapBlob(password, blob);
    memory.state = await hydrateState(JSON.parse(res.json));
    memory.identity = memory.state.identity;
    if (res.legacy || res.iter < ITERATIONS) adoptKey(await deriveFresh(password));
    else adoptKey(res);
    await persist();
    return memory.state;
  }

  async function changePassword(oldPass, newPass) {
    checkPassword(newPass);
    if (!memory.state) await unlock(oldPass);
    else {
      const blob = await getLocal(STORAGE_KEY);
      await unwrapBlob(oldPass, blob);
    }
    adoptKey(await deriveFresh(newPass));
    await persist();
  }

  async function destroy() {
    await burnVaultNow();
  }

  /* New long-term identity. Password must match. Contacts and history on this
     device become unreadable — they were sealed to the old key. Vault password stays. */
  async function rotateIdentity(password) {
    checkPassword(password);
    const blob = await getLocal(STORAGE_KEY);
    if (!blob) throw new Error("Хранилище ещё не создано");
    await unwrapBlob(password, blob);
    const state = requireState();
    if (state.identity && state.identity.privateRaw && state.identity.privateRaw.fill) {
      state.identity.privateRaw.fill(0);
    }
    for (const c of state.contacts) wipeContactSession(c);
    const identity = await C().generateIdentity();
    state.identity = identity;
    memory.identity = identity;
    state.contacts = [];
    state.sentCache = {};
    state.threads = {};
    state.settings = blankSettings();
    state.settings.pendingSession = null;
    state.settings.onboarded = false;
    await removeLocal(BURN_AT_KEY);
    state.threads = {};
    state.fragBuf = {};
    await persist();
    return state;
  }

  async function publicKeyText() {
    const state = requireState();
    const ttl = (state.settings && state.settings.keyTtlSec) >>> 0;
    if (!ttl) return P().encodePublicKey(state.identity.publicRaw);
    let pending = state.settings.pendingSession;
    /* Prefer existing pending (even after attach) so the reply QR matches the session just formed. */
    if (!pending || pending.ttlSec !== ttl || !pending.pubB64 || !pending.privB64) {
      pending = await ensurePendingSession(ttl);
    }
    return P().encodeTimedKey(
      state.identity.publicRaw,
      C().b64urlToBytes(pending.pubB64),
      pending.ttlSec,
      pending.issuedAt
    );
  }

  async function myFingerprint() {
    const state = requireState();
    return C().fingerprintDisplay(state.identity.publicRaw);
  }

  function getSettings() {
    return requireState().settings;
  }

  async function setStrict(v) {
    requireState().settings.strict = !!v;
    await persist();
  }

  global.S256Vault = {
    hasVault,
    create,
    unlock,
    restoreSession,
    lock,
    persist,
    addContact,
    removeContact,
    renameContact,
    setVerified,
    setSetting,
    bindPeer,
    unbindPeer,
    findByBinding,
    findByFingerprint,
    encryptForContact,
    encryptForPeer,
    decryptPacket,
    ingestPackets,
    listChats,
    getThread,
    expireSessions,
    sessionView,
    ttlPhrase,
    enforceBurn,
    burnView,
    getBurnAt,
    burnVaultNow,
    ensureSafePair,
    setPairMode,
    pairModeView,
    isSafeLocked,
    isBurnMode,
    commitSafePair,
    exportBackup,
    importBackup,
    changePassword,
    rotateIdentity,
    destroy,
    publicKeyText,
    myFingerprint,
    getSettings,
    setStrict,
    requireState,
    isUnlocked: () => !!memory.state,
    canWrite: () => !!(memory.state && memory.key),
    getState: () => memory.state,
    probeStore,
    persistMode: () => persistMode,
    ITERATIONS,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

  function fmtChatTime(ts) {

    if (d.toDateString() === now.toDateString()) {
      return d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleDateString(loc, { day: "numeric", month: "short" });
  }

  function fmtBurnLeft(burnAt) {
    const ms = Math.max(0, burnAt - Date.now());
    const sec = Math.floor(ms / 1000);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h >= 24) {
      const d = Math.floor(h / 24);
      return d + (lang === "en" ? "d " : "д ") + (h % 24) + (lang === "en" ? "h" : "ч");
    }
    if (h > 0) return h + (lang === "en" ? "h " : "ч ") + m + (lang === "en" ? "m" : "м");
    return m + (lang === "en" ? "m" : "м");
  }

  async function deliverCipher(packetOrPackets, bindings) {
    const packets = Array.isArray(packetOrPackets)
      ? packetOrPackets.filter(Boolean)
      : packetOrPackets
        ? [packetOrPackets]
        : [];
    if (!packets.length) return "copy";
    if (!isExt || !chrome.tabs) {
      try {
        await navigator.clipboard.writeText(packets.join("\n\n"));
      } catch (_) {
        /* ignore */
      }
      return "copy";
    }
    let delivered = false;
    let wrong = false;
    try {
      const tabs = await chrome.tabs.query({ url: TAB_URLS });
      for (let i = 0; i < tabs.length; i++) {
        try {
          for (let p = 0; p < packets.length; p++) {
            const r = await chrome.tabs.sendMessage(tabs[i].id, {
              type: "S256_INJECT",
              text: packets[p],
              bindings: bindings || {},
            });
            if (r && r.ok) delivered = true;
            else if (r && r.wrongChat) wrong = true;
            if (p + 1 < packets.length) await new Promise((r) => setTimeout(r, 450));
          }
        } catch (_) {
          /* frame without content script */
        }
      }
    } catch (_) {
      /* query failed */
    }
    if (delivered) return "sent";
    try {
      await navigator.clipboard.writeText(packets.join("\n\n"));
    } catch (_) {
      /* ignore */
    }
    return wrong ? "wrong" : "copy";
  }

  /* Extension: vault lives in the service worker. Popup/page only mirrors session. */
  async function vaultCreate(password) {
    if (isExt && chrome.runtime && chrome.runtime.id) {
      const r = await chrome.runtime.sendMessage({ type: "S256_CREATE", password });
      if (!r || !r.ok) throw new Error((r && r.error) || "не удалось создать");
      await V().restoreSession();
      return;
    }
    await V().create(password);
  }

  async function vaultUnlock(password) {
    if (isExt && chrome.runtime && chrome.runtime.id) {
      const r = await chrome.runtime.sendMessage({ type: "S256_UNLOCK", password });
      if (!r || !r.ok) throw new Error((r && r.error) || "Неверный пароль");
      await V().restoreSession();
      return;
    }
    await V().unlock(password);
  }

  async function vaultLock() {
    if (isExt && chrome.runtime && chrome.runtime.id) {

        await chrome.runtime.sendMessage({ type: "S256_LOCK" });

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    setNotice(t("copied"), "ok");
    await render();
  }

  async function share(text, title) {
    if (navigator.share) {
      try {
        await navigator.share({ title: title || "Pairlock", text });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    await copy(text);
  }

  function drawQr(id, text) {
    const el = document.getElementById(id);
    if (!el || typeof qrcode !== "function") return;
    try {
      const q = qrcode(0, "M");
      q.addData(text, "Byte");
      q.make();
      el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch {
      el.innerHTML = "";
    }
  }

  async function qrPngBlob() {
    const svg = document.querySelector("#qr svg");
    if (!svg) return null;
    const xml = new XMLSerializer().serializeToString(svg);
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
    const img = new Image();
    img.src = url;
    await img.decode();
    const canvas = document.createElement("canvas");
    canvas.width = 640;
    canvas.height = 640;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 640, 640);
    ctx.drawImage(img, 0, 0, 640, 640);
    return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  }

  async function shareQrPng() {
    const blob = await qrPngBlob();
    if (!blob) throw new Error("QR");
    const file = new File([blob], "s256-qr.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Pairlock", text: t("qrShareCaption") });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "s256-qr.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

        if (a !== b) {
          setNotice(t("mismatch"), "err");
          return viewLocked();
        }

          obStep = 1;

          chatVerify = false;
          await render();
        } catch (e) {
          setNotice(e.message, "err");
          await viewLocked();
        }
      };
      return;
    }

    app.innerHTML = `
      ${header(`<span class="pill">${esc(t("locked"))}</span>`)}
      <div class="card">
        <h2>${esc(t("unlockTitle"))}</h2>
        <p class="lead">${esc(t("unlockLead"))}</p>

          <button class="btn" id="unlock">${esc(t("unlock"))}</button>
        </div>
        <div class="${noticeType}">${esc(notice)}</div>
      </div>`;
    bindLang();
    document.getElementById("pw").focus();
    document.getElementById("unlock").onclick = async () => {
      try {
        await vaultUnlock(document.getElementById("pw").value);
        setNotice("", "ok");
        await render();
      } catch (e) {
        setNotice(e.message, "err");
        await viewLocked();
      }

      if (e.key === "Enter") document.getElementById("unlock").click();
    });
  }

              <button class="btn" id="ob-send">${esc(t("obSendGo"))}</button>
              <button class="btn secondary" id="save-qr">${esc(t("saveQr"))}</button>
              <button class="btn ghost" id="share-pub">${esc(t("shareKey"))}</button>
            </div>
          </div>
          ${obKeySent ? `<div class="wait-box"><b>${esc(t("obSent"))}</b><p>${esc(t("obSentHint"))}</p></div>` : ""}
          <div class="row wizard-nav">
            <button class="btn" id="ob-next"${obKeySent ? "" : " disabled"}>${esc(t("obNext"))}</button>
            <button class="btn ghost" id="ob-skip">${esc(t("obSkip"))}</button>
          </div>
        </div>`;
    }
    if (obStep === 2) {
      return `
        <div class="wizard">
          ${stepsHtml(2, total)}
          <h2>${esc(t("obT2"))}</h2>
          <p class="lead">${esc(t("obL2"))}</p>
          <div class="wait-box"><b>${esc(t("obWait"))}</b><p>${esc(t("obSentHint"))}</p></div>
          <label>${esc(t("name"))}</label>
          <input id="cname" type="text" placeholder="Саша" />
          <label>${esc(t("theirKey"))}</label>
          <textarea id="ckey" placeholder="S256K1.…"></textarea>
          <div class="row wizard-nav">
            <button class="btn" id="ob-add">${esc(t("obPair"))}</button>
            <button class="btn ghost" id="ob-back">${esc(t("obBack"))}</button>
          </div>
        </div>`;
    }
    const contact = state.contacts.find((c) => c.id === obContactId) || state.contacts[state.contacts.length - 1];
    if (!contact) {
      obStep = 2;
      return onboardingHtml(state, fp, pub);
    }
    return verifyCardHtml(contact, fp, { steps: stepsHtml(3, total) });
  }

  async function finishOnboarding() {
    try {
      await V().setSetting("onboarded", true);
    } catch (_) {
      /* read-only session */
    }
    wizardForced = false;
    obStep = 1;
    obContactId = null;
    obKeySent = false;
    tab = "pad";
  }

  function bindVerifyButtons(contactId, after) {
    const match = document.getElementById("vf-match");
    const mismatch = document.getElementById("vf-mismatch");
    const later = document.getElementById("vf-later");
    if (match)
      match.onclick = async () => {
        try {
          await V().setVerified(contactId, true);
          setNotice(t("obDone"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await after("match");
      };
    if (mismatch)
      mismatch.onclick = async () => {
        try {
          await V().removeContact(contactId);
        } catch (_) {
          /* ignore */
        }
        setNotice(t("obMismatchMsg"), "err");
        await after("mismatch");
      };
    if (later)
      later.onclick = async () => {
        setNotice(t("unverifiedWarn"), "warn");
        await after("later");
      };
  }

  function markKeySent() {
    obKeySent = true;
    render();
  }

  function bindOnboarding(pub, fp) {
    const sendBtn = document.getElementById("ob-send");
    if (sendBtn)
      sendBtn.onclick = async () => {
        try {
          await copy(pub);
          setNotice(t("copied"), "ok");
        } catch (_) {
          /* clipboard may fail — still allow continue after share */
        }
        obKeySent = true;
        await render();
      };
    const next = document.getElementById("ob-next");
    if (next)
      next.onclick = () => {
        if (!obKeySent) {
          setNotice(t("obNeedSend"), "warn");
          return;
        }
        obStep = 2;
        notice = "";
        render();
      };
    const back = document.getElementById("ob-back");
    if (back)
      back.onclick = () => {
        obStep = 1;
        notice = "";
        render();
      };
    const skip = document.getElementById("ob-skip");
    if (skip)
      skip.onclick = async () => {
        await finishOnboarding();
        render();
      };
    const add = document.getElementById("ob-add");
    if (add)
      add.onclick = async () => {
        try {
          const c = await V().addContact(document.getElementById("cname").value, document.getElementById("ckey").value);
          obContactId = c.id;
          obStep = 3;
          notice = "";
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    if (obStep === 3 && obContactId) {
      bindVerifyButtons(obContactId, async (outcome) => {
        if (outcome === "mismatch") {
          obStep = 2;
          obContactId = null;
        } else {
          await finishOnboarding();
        }
        await render();
      });
    }
    if (obStep === 1) drawQr("qr", pub);
    const sharePub = document.getElementById("share-pub");
    if (sharePub)
      sharePub.onclick = async () => {
        await share(pub + "\n" + fp, "Pairlock");
        obKeySent = true;
        setNotice(t("obSent"), "ok");
        await render();
      };
    const saveQr = document.getElementById("save-qr");
    if (saveQr)
      saveQr.onclick = async () => {
        try {
          await shareQrPng();
          obKeySent = true;
          setNotice(t("obSent"), "ok");
          await render();
        } catch (e) {
          setNotice(e.message, "err");
        }
      };
  }

    app.classList.toggle("im-focus", chatFocus);
    app.innerHTML = `
      ${chatFocus ? "" : header(`<div class="row" style="margin:0">${isPopup ? `<button class="btn ghost" id="full" style="padding:8px 12px">${esc(t("window"))}</button>` : ""}<span class="pill"><span class="status-dot"></span>${esc(t("open"))}</span></div>`)}
      ${tabsHtml()}
      <div class="card${chatFocus ? " card-im" : ""}">
        ${body}
        ${notice ? `<div class="${noticeType}">${esc(notice)}</div>` : ""}
      </div>`;

    bindLang();
    if (showWizard) {
      bindOnboarding(pub, fp);
    } else if (showGoSite) {
      const goOk = document.getElementById("go-ok");
      if (goOk)
        goOk.onclick = async () => {
          await finishOnboarding();
          setNotice("", "ok");
          await render();
        };
      const goPair = document.getElementById("go-pair-here");
      if (goPair)
        goPair.onclick = () => {
          wizardForced = true;
          obStep = 1;
          obContactId = null;
          obKeySent = false;
          notice = "";
          render();
        };
    } else if (tab === "keys" && rotateStep === 0) {
      drawQr("qr", pub);
    }
    const rotatePhrase = document.getElementById("rotate-phrase");
    if (rotatePhrase) rotatePhrase.focus();
    const rotatePw = document.getElementById("rotate-pw");
    if (rotatePw) rotatePw.focus();

    const startWizard = document.getElementById("start-wizard");
        if (startWizard)
      startWizard.onclick = () => {
        wizardForced = true;
        obStep = 1;
        obContactId = null;
        obKeySent = false;
        tab = "pad";
        notice = "";
        render();
      };

    if (verifyId) {
      bindVerifyButtons(verifyId, async () => {
        verifyId = null;
        await render();
      });
    }
    if (chatVerify && chatFocus) {
      const openId = resolveChatId();
      if (openId)
        bindVerifyButtons(openId, async (result) => {
          chatVerify = false;
          if (result === "mismatch") chatId = null;
          await render();
        });
    }
    const imVerify = document.getElementById("im-verify");
    if (imVerify)
      imVerify.onclick = () => {
        chatVerify = true;
        notice = "";
        render();
      };
    const imVerifyHide = document.getElementById("im-verify-hide");
    if (imVerifyHide)
      imVerifyHide.onclick = () => {
        chatVerify = false;
        notice = "";
        render();
      };
    app.querySelectorAll("[data-verify]").forEach((el) => {
      el.onclick = () => {
        verifyId = el.dataset.verify;
        notice = "";
        render();
      };
    });

    const full = document.getElementById("full");
    if (full && isExt && chrome.runtime) {
      full.onclick = () => {
        const url = chrome.runtime.getURL("index.html");
        if (chrome.windows && chrome.windows.create) {
          chrome.windows.create({ url, type: "popup", width: 400, height: 680, focused: true });
          return;
        }
        chrome.tabs.create({ url });
      };
    }
    app.querySelectorAll(".tab").forEach((el) => {
      el.onclick = () => {
        tab = el.dataset.tab;
        verifyId = null;
        wizardForced = false;
        rotateStep = 0;
        peopleDelId = null;
        notice = "";
        render();
      };
    });

    const keepFields = async (fn) => {
      const plain = document.getElementById("plain") && document.getElementById("plain").value;
      const cipher = document.getElementById("cipher") && document.getElementById("cipher").value;
      await fn();
      await render();
      const p = document.getElementById("plain");
      const c = document.getElementById("cipher");
      if (p && plain != null) p.value = plain;
      if (c && cipher != null) c.value = cipher;
    };

    app.querySelectorAll(".seg-btn").forEach((el) => {
      el.onclick = () =>
        keepFields(async () => {
          padMode = el.dataset.mode;
          notice = "";
        });
    });
    const who = document.getElementById("who");
    if (who) who.onchange = () => (padWho = who.value);

    const enc = document.getElementById("enc");
    if (enc) {
      enc.onclick = () =>
        keepFields(async () => {
          try {
            const id = document.getElementById("who").value;
            if (!id) throw new Error(t("needContact"));
            padWho = id;
            const text = document.getElementById("plain").value;
            if (!text.trim()) throw new Error(t("s2Text"));
            const packets = await V().encryptForContact(id, text);
            padResult = { kind: "enc", text: packets.join("\n\n") };
            try {
              await navigator.clipboard.writeText(packets.join("\n\n"));
              setNotice(packets.length > 1 ? "Частей: " + packets.length : t("encDone"), "ok");
            } catch (_) {
              setNotice(t("copied"), "ok");
            }
          } catch (e) {
            setNotice(e.message, "err");
          }
        });
    }
    const dec = document.getElementById("dec");
    if (dec) {
      dec.onclick = () =>
        keepFields(async () => {
          const cipher = document.getElementById("cipher").value;
          try {
            const res = await V().decryptPacket(cipher);
            let meta = "";
            let metaType = "ok";
            if (res.outgoing) meta = t("padEnc") + " → " + (res.contact ? res.contact.name : "");
            else if (!res.known) {
              meta = t("unknownSender");
              metaType = "warn";
            } else if (!res.verified) {
              meta = t("from") + " " + res.contact.name + " · " + t("fromUnverified");
              metaType = "warn";
            } else meta = t("from") + " " + res.contact.name + " ✓";
            padResult = { kind: "dec", text: res.text, meta, metaType };
            setNotice("", "ok");
          } catch (e) {
            padResult = null;
            setNotice(e.message, "err");
          }
        });
    }
    const copyC = document.getElementById("copy-c");
    if (copyC) copyC.onclick = () => copy(padResult ? padResult.text : "");
    const shareC = document.getElementById("share-c");
    if (shareC) shareC.onclick = () => share(padResult ? padResult.text : "", "Pairlock");

    app.querySelectorAll("[data-chat]").forEach((el) => {
      el.onclick = () => {
        chatId = el.dataset.chat;
        showPad = false;
        chatDraft = "";
        chatVerify = false;
        chatStick = true;
        chatForceBottom = true;
        notice = "";
        render();
      };
    });
    const padManual = document.getElementById("pad-manual");
    if (padManual)
      padManual.onclick = () => {
        showPad = true;
        notice = "";
        render();
      };
    const imBack = document.getElementById("im-back");
    if (imBack)
      imBack.onclick = () => {
        chatId = null;
        showPad = false;
        chatDraft = "";
        chatVerify = false;
        notice = "";
        render();
      };
    const imText = document.getElementById("im-text");
    const imMsgs = document.getElementById("im-msgs");
    const imJump = document.getElementById("im-jump");
    if (imMsgs) {
      if (chatForceBottom || chatStick) {
        imMsgs.scrollTop = imMsgs.scrollHeight;
        chatForceBottom = false;
        chatStick = true;
      } else {
        imMsgs.scrollTop = chatScrollTop;
      }
      const syncJump = () => {
        chatStick = msgsNearBottom(imMsgs);
        if (imJump) imJump.hidden = chatStick;
      };
      syncJump();
      imMsgs.onscroll = syncJump;
      if (imJump)
        imJump.onclick = () => {
          chatStick = true;
          chatForceBottom = false;
          imMsgs.scrollTop = imMsgs.scrollHeight;
          imJump.hidden = true;
        };
    }
    if (imText) {
      imText.value = chatDraft;
      if (chatSel && chatSel.focused) {
        imText.focus();
        try {
          imText.setSelectionRange(chatSel.start, chatSel.end);
        } catch (_) {
          /* ignore */
        }
      }
      const grow = () => {
        imText.style.height = "auto";
        imText.style.height = Math.min(160, Math.max(42, imText.scrollHeight)) + "px";
      };
      grow();
      imText.oninput = () => {
        chatDraft = imText.value;
        grow();
      };
      imText.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          document.getElementById("im-send") && document.getElementById("im-send").click();
        }
      };
    }
    const imSend = document.getElementById("im-send");
    if (imSend) {
      imSend.onclick = async () => {
        const ta = document.getElementById("im-text");
        const text = ta ? ta.value : chatDraft;
        if (!String(text).trim()) return;
        const id = resolveChatId();
        if (!id) return;
        imSend.disabled = true;
        chatDraft = "";
        chatSel = { start: 0, end: 0, focused: true };
        chatStick = true;
        chatForceBottom = true;
        if (ta) {
          ta.value = "";
          ta.style.height = "";
        }
        try {
          const packets = await V().encryptForContact(id, text.trim());
          const thread = V().getThread(id);
          const how = await deliverCipher(packets, thread.contact.bindings);
          if (how === "wrong") setNotice(t("imWrong"), "warn");
          else if (how === "copy" && !Object.keys(thread.contact.bindings || {}).length) setNotice(t("imNeedBind"), "warn");
          else if (how === "copy") setNotice(t("imCopied"), "ok");
          else if (packets.length > 1) setNotice("Отправлено частями: " + packets.length, "ok");
          else setNotice("", "ok");
        } catch (e) {
          chatDraft = text;
          if (ta) ta.value = text;
          setNotice(e.message, "err");
        } finally {
          imSend.disabled = false;
        }
        await render();
      };
    }

    const unbind = document.getElementById("unbind");
    if (unbind)
      unbind.onclick = async () => {
        try {
          await V().unbindPeer(unbind.dataset.cid, currentPeer.platform);
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    if (!showWizard) {
      const copyPub = document.getElementById("copy-pub");
      if (copyPub) copyPub.onclick = () => copy(pub);
      const sharePub = document.getElementById("share-pub");
      if (sharePub) sharePub.onclick = () => share(pub + "\n" + fp, "Pairlock");
      const saveQr = document.getElementById("save-qr");
      if (saveQr) {
        saveQr.onclick = async () => {
          try {
            await shareQrPng();
            setNotice(t("copied"), "ok");
          } catch (e) {
            setNotice(e.message, "err");
          }
        };
      }
    }
    const lock = document.getElementById("lock");
    if (lock)
      lock.onclick = async () => {
        await vaultLock();
        setNotice("", "ok");
        await render();
      };
    const ttl = document.getElementById("ttl");
    if (ttl) {
      ttl.onchange = async () => {
        try {
          await V().setSetting("keyTtlSec", Number(ttl.value));
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
    const burn = document.getElementById("burn");
    if (burn) {
      burn.onchange = async () => {
        const n = Number(burn.value);
        if (n > 0 && !window.confirm(t("burnConfirm"))) {
          await render();
          return;
        }
        try {
          await V().setSetting("burnVaultSec", n);
          setNotice(n ? t("burnTitle") + " · " + (n === 86400 ? t("burn1d") : t("burn1h")) : t("burnOff"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
    const modeSafe = document.getElementById("mode-safe");
    if (modeSafe) modeSafe.onclick = null;
    const modeForever = document.getElementById("mode-forever");
    if (modeForever) modeForever.onclick = null;
    app.querySelectorAll("[data-offer-ttl]").forEach((el) => {
      el.onclick = async () => {
        const ttl = Number(el.dataset.offerTtl);
        try {
          if (isExt && chrome.runtime && chrome.runtime.id) {
            const r = await chrome.runtime.sendMessage({
              type: "S256_SET_PAIR_MODE",
              mode: ttl > 0 ? "safe" : "forever",
              ttlSec: ttl > 0 ? ttl : 0,
            });
            if (!r || !r.ok) throw new Error((r && r.error) || "error");
            await V().restoreSession();
          } else if (ttl > 0) {
            await V().setPairMode("safe", ttl);
          } else {
            await V().setPairMode("forever");
          }
          setNotice(ttl > 0 ? t("pairPickTtl") + ": " + el.textContent : t("pairForever"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    });
    app.querySelectorAll("[data-safe-ttl]").forEach((el) => {
      el.onclick = null;
    });
    const pageDecrypt = document.getElementById("page-decrypt");
    if (pageDecrypt) {
      pageDecrypt.onchange = async () => {
        try {
          await V().setSetting("pageDecrypt", pageDecrypt.checked);
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
    const stealthWire = document.getElementById("stealth-wire");
    if (stealthWire) {
      stealthWire.onchange = async () => {
        try {
          await V().setSetting("stealthWire", stealthWire.checked);
          setNotice(stealthWire.checked ? t("stealthWire") : "S256M1.", "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
    const rotateStart = document.getElementById("rotate-start");
    if (rotateStart)
      rotateStart.onclick = () => {
        rotateStep = 1;
        notice = "";
        render();
      };
    const rotateCancel = document.getElementById("rotate-cancel");
    if (rotateCancel)
      rotateCancel.onclick = () => {
        rotateStep = 0;
        notice = "";
        render();
      };
    const rotateNext = document.getElementById("rotate-next");
    if (rotateNext)
      rotateNext.onclick = () => {
        if (rotateStep === 2) {
          const typed = (document.getElementById("rotate-phrase") && document.getElementById("rotate-phrase").value) || "";
          if (typed.trim() !== t("rotatePhrase")) {
            setNotice(t("rotateNeedPhrase"), "err");
            return;
          }
        }
        rotateStep += 1;
        notice = "";
        render();
      };
    const rotateGo = document.getElementById("rotate-go");
    if (rotateGo)
      rotateGo.onclick = async () => {
        const pw = (document.getElementById("rotate-pw") && document.getElementById("rotate-pw").value) || "";
        try {
          await V().rotateIdentity(pw);
          rotateStep = 0;
          wizardForced = true;
          obStep = 1;
          obContactId = null;
          obKeySent = false;
          tab = "pad";
          setNotice(t("rotateDone"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    const add = document.getElementById("add");
    if (add) {
      add.onclick = async () => {
        try {
          const c = await V().addContact(document.getElementById("cname").value, document.getElementById("ckey").value);
          /* go straight to the voice check for the new contact */
          verifyId = c.id;
          peopleManual = false;
          setNotice(t("added"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
    app.querySelectorAll("[data-del]").forEach((el) => {
      el.onclick = () => {
        peopleDelId = el.dataset.del;
        notice = "";
        render();
      };
    });
    app.querySelectorAll("[data-del-cancel]").forEach((el) => {
      el.onclick = () => {
        peopleDelId = null;
        render();
      };
    });
    app.querySelectorAll("[data-del-yes]").forEach((el) => {
      el.onclick = async () => {
        try {
          await V().removeContact(el.dataset.delYes);
          peopleDelId = null;
          setNotice("", "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    });
    const peopleManualBtn = document.getElementById("people-manual");
    if (peopleManualBtn)
      peopleManualBtn.onclick = () => {
        peopleManual = !peopleManual;
        peopleDelId = null;
        notice = "";
        render();
      };
    app.querySelectorAll("[data-rename]").forEach((el) => {
      el.onclick = async () => {
        const cur = el.dataset.name || "";
        const next = window.prompt(t("name"), cur);
        if (next == null) return;
        try {
          await V().renameContact(el.dataset.rename, next);
          setNotice(t("copied"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    });
    app.querySelectorAll("[data-bind]").forEach((el) => {
      el.onclick = async () => {
        if (!currentPeer) return;
        try {
          await V().bindPeer(el.dataset.bind, currentPeer.platform, currentPeer.peer);
          setNotice("🔒 " + t("stEnc"), "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    });
    app.querySelectorAll("[data-bind-next]").forEach((el) => {
      el.onclick = async () => {
        bindNext = true;
        if (isExt) chrome.runtime.sendMessage({ type: "S256_BIND_NEXT", contactId: el.dataset.bindNext });
        setNotice("…", "ok");
        await render();
      };
    });
    const exp = document.getElementById("export");
    if (exp) {
      exp.onclick = async () => {
        const blob = await V().exportBackup();
        downloadText("s256-vault.txt", blob);
        setNotice(t("copied"), "ok");
      };
    }
    const imp = document.getElementById("import");
    if (imp) {
      imp.onclick = async () => {
        try {
          await V().importBackup(document.getElementById("backup").value, document.getElementById("backup-pw").value);
          setNotice("ok", "ok");
        } catch (e) {
          setNotice(e.message, "err");
        }
        await render();
      };
    }
  }

  async function loadPeerFromTab() {
    if (!isPopup || !isExt || !chrome.tabs) return;
    try {
      const [tabInfo] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (!tabInfo) return;
      const r = await chrome.tabs.sendMessage(tabInfo.id, { type: "S256_GET_PEER" });
      if (r && r.peer) {
        currentPeer = r;
        try {
          currentPeer.host = new URL(tabInfo.url || "").hostname;
        } catch (_) {
          /* no tab url permission */
        }
      }
    } catch {
      currentPeer = null;
    }
  }

  async function render() {
    if (!(crypto && crypto.subtle)) {
      app.innerHTML = `<div class="card"><h2>${esc(t("noCrypto"))}</h2></div>`;
      return;
    }
    try {
      if (V().enforceBurn && (await V().enforceBurn())) {
        setNotice(t("burnDone"), "warn");
      }
    } catch {
      /* ignore */
    }
    try {
      if (V().probeStore) await V().probeStore();
    } catch {
      /* ignore */
    }
    try {
      await V().restoreSession();
    } catch {
      /* ignore */
    }
    if (!V().isUnlocked()) return viewLocked();
    if (tab === "pad" && !showPad && !chatPoll) {
      chatPoll = setInterval(() => {
        if (tab !== "pad" || showPad || document.hidden) return;
        render();
      }, 2500);
    }
    return viewApp();
  }

  if (location.protocol === "https:" && "serviceWorker" in navigator && !isExt) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  try {
    loadPeerFromTab().finally(render);
  } catch (e) {
    if (app) app.innerHTML = "<div class='card'><p class='err'>" + String(e && e.message ? e.message : e) + "</p></div>";
  }
})();

</script>
</body>
</html>
